planners:
  single:
    hybrid_astar: single_multimodal_hybrid_astar
    constant_primitive: single_constant_primitive
    continuous_mode_path: single_continuous_mode_path
    state_lattice: single_state_lattice
  multi:
    multi_4wis: multi_4wis
controllers:
  pid: pid
  nonlinear_feedback: nonlinear
defaults:
  planners:
    single: state_lattice
    multi: multi_4wis
  baseline_planners:
    single: continuous_mode_path
  controller: nonlinear_feedback
  tracking_implementation: cpp
  architecture_profile: optimized
  experiment: short_turn
  speed_profile: standard
  timeout_s: 180
  observation_s: 5
formation:
  name: wedge
  implementation: uniform_v02
  lead_s: 1.25
  release_margin_s: 0.20
optimized_multi_defaults:
  native_frontier: true
  convex_corridor: true
  reachability_retime: true
acceptance:
  terminal_position_m: 0.10
  terminal_yaw_rad: 0.10
  max_mount_error_m: 0.10
real_vehicle_adapter:
  available: false
  ros1_ros2_bridge_config: null
  device_id: null
  namespace_pattern: /robot{vehicle_id}
  odom_topic: odom
  status_topic: motion_state
  command_topic: cmd_vel
  emergency_stop_topic: emergency_stop
  state_timeout_s: 0.20

# Planner limits reserve feedback authority inside the controller's envelope.
profiles:
  single:
    vehicle:
      r_min_ack: 0.90
      mode_switch_duration: 0.70

    quality:
      limits:
        profile: ranger_twist_integration
        translation_speed_policy: restricted
        target_v: 0.16
        v_max: 0.16
        a_max: 0.22
        jerk_max: 0.8
        omega_max: 0.40
        alpha_max: 0.45
        angular_jerk_max: 1.0
        translation_omega_max: 0.40
        translation_alpha_max: 0.45
        translation_angular_jerk_max: 1.0
  multi:
    prefer_ackermann: true
    timing_limits:
      r_min_ackermann: 0.90
      v_max: 0.16
      a_max: 0.22
      yaw_rate_max: 0.40
      yaw_accel_max: 0.45
      mode_switch_duration: 0.70

# Standard is for the kinematic Gazebo experiments. The tracker and plant
# caps stay below the manual's 0.75 m/s derating for steering above 20 degrees.
speed_profiles:
  baseline: {}
  standard:
    single: {target_v: 0.60, v_max: 0.60, a_max: 0.42, jerk_max: 1.30}
    multi: {v_max: 0.50, a_max: 0.36}
    controller: {max_speed: 0.72, max_accel: 0.60}
    plant: {max_speed: 0.72}
