<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>规划数据人工采集</title>
<style>body{font:15px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;margin:0;background:#f3f5f8;color:#20304a}main{max-width:1300px;margin:auto;padding:22px}h1{font-size:25px;margin:0 0 10px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select,textarea{font:inherit;border:1px solid #bdc9d8;border-radius:6px;padding:9px;background:white}button{cursor:pointer;white-space:nowrap}button:disabled{opacity:.4;cursor:default}.primary{background:#1764bf;color:white}canvas{display:block;width:100%;height:auto;aspect-ratio:1100/650;background:#ddd;border-radius:8px}.panel{background:white;border-radius:10px;padding:16px;margin-top:14px}textarea{width:100%;box-sizing:border-box;min-height:65px}.muted{color:#69788c;font-size:13px}#message{white-space:pre-wrap;color:#175e3b;overflow-wrap:anywhere}.bad{color:#a43224}.good{color:#1b7646}#metrics{line-height:1.9}.grow{flex:1;min-width:200px}input[type=range]{flex:1;min-width:100px}.note{background:#fff4dd;padding:12px;line-height:1.8}#details{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#1764bf}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.tile{padding:10px;background:#f4f7fb;border-radius:8px}.tile svg{width:100%;height:auto;background:#ddd}.tile p{font-size:13px;overflow-wrap:anywhere}
</style>
<main><h1 id="title">规划数据人工采集</h1><div id="root" class="muted"></div><p class="note" id="instructions">在 RViz 设置起点和终点，观察规划及回放后，在这里标注。每次规划自动保存待筛选记录；人工标签不会自动用于训练。新任务出现时会提示，请先保存正在查看的这一条。</p>
<div class="bar"><select id="filter"><option value="all">全部记录</option><option value="pending">待标注</option><option value="approved">优质</option><option value="comparison">参考</option><option value="rejected">剔除</option></select><select id="records" class="grow"></select><button id="latest">查看最新任务</button><button id="sameTask">同任务对照</button><button id="showAll">取消同任务过滤</button><button id="export">导出标签 JSON</button></div>
<div id="arrival" class="bad"></div><section id="comparisonPanel" class="panel" hidden><h2>同任务、同车辆配置对照</h2><div id="comparisonCards" class="tiles"></div></section><div class="panel"><h2 id="name">等待 RViz 规划请求</h2><div id="metrics"></div><canvas id="canvas" width="1100" height="650"></canvas><div class="bar"><button id="play">播放</button><input id="seek" type="range" value="0" min="0" step="0.01"><select id="speed"><option value="1">1× 实际时间</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select><button id="switch">下一切换</button><label><input id="corridors" type="checkbox" checked>安全走廊</label></div><div id="time" class="muted"></div></div>
<div class="panel"><div class="bar"><select id="grade"><option value="pending">待筛选</option><option value="approved">优质：供模仿学习</option><option value="comparison">参考：失败或值得比较</option><option value="rejected">剔除</option></select><button id="save" class="primary">保存本条标签和预览图</button><button id="timeout">记录等待超时</button></div><textarea id="notes" placeholder="可选理由：不必要 Spin、切换太早、路线绕远、倒车过多、路线很好……"></textarea><div class="bar" id="reasons"></div><p id="eligibility"></p><div id="message"></div></div>
<details class="panel"><summary>任务、车辆配置与审核详情</summary><pre id="details"></pre></details></main>
<script>
'use strict';const $=id=>document.getElementById(id),COLORS=['#00a8e8','#ed8a00','#b546ea'],MODES=['A','O','Spin'],LABELS={pending:'待筛选',approved:'优质',comparison:'参考',rejected:'剔除'};let state=null,record=null,selected=null,dirty=false,playing=false,t=0,last=0,mapImage=null,scope=null,knownLatest=null,loading=false;
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const value=await r.json();if(!r.ok)throw Error(value.error||r.statusText);return value}
function gradeOf(r){return state.secondary?r.review_label:r.label}
function list(){const sel=$('records');sel.replaceChildren();const filter=$('filter').value;let rows=state.records.filter(r=>(!scope||r.task_id===scope)&&(filter==='all'||gradeOf(r)===filter));for(const r of rows){const o=document.createElement('option');o.value=r.record_id;o.textContent=`#${r.plan_id} · ${r.branch} · ${LABELS[gradeOf(r)]||'待筛选'} · ${r.outcome}`;sel.append(o)}sel.value=selected||'';return rows}
async function refresh(){try{state=await api('/api/state');$('root').textContent='数据目录：'+state.root;$('title').textContent=state.secondary?'采集数据二次审核':'规划数据人工采集';if(state.secondary)$('instructions').textContent='这里汇总已保存的数据。二次审核使用独立复核结果；初筛标签保留。可用“同任务对照”查看相同地图和起终点的其他分支结果。二次标签也不会自动启动训练。';list();const latest=state.records[state.records.length-1];if(latest&&latest.record_id!==knownLatest){knownLatest=latest.record_id;if(!selected)await load(latest.record_id);else if(latest.record_id!==selected)$('arrival').textContent='有新任务。保存当前标注后，点击“查看最新任务”。'}const meta=state.records.find(r=>r.record_id===selected);if(meta&&!dirty&&record&&meta.result_sha256!==record.result_sha256)await load(selected)}catch(e){$('message').textContent='连接失败：'+e.message}}
async function load(id){if(loading)return;loading=true;try{record=await api('/api/record/'+id);selected=id;dirty=false;playing=false;t=0;$('play').textContent='播放';$('records').value=id;$('grade').value=gradeOf(record)||'pending';$('notes').value=(state.secondary?record.review_notes:record.notes)||'';$('name').textContent=`${record.branch} · 任务 #${record.plan_id}`;const a=record.analysis;const eligible=state.secondary?!!a?.eligible:record.eligible;$('grade').querySelector('[value=approved]').disabled=!eligible;$('save').disabled=!record.final&&!state.secondary;$('grade').disabled=!record.final&&!state.secondary;$('notes').disabled=!record.final&&!state.secondary;$('timeout').disabled=state.secondary||record.final;$('eligibility').className=eligible?'good':'bad';$('eligibility').textContent=eligible?'共同审核通过，可以标为优质。人工判断仍由你决定。':`不能选为优质：${a?.reason||record.eligibility_reason||record.quality_report?.selected?.reason||record.quality_report?.reason||record.outcome}`;const timing=record.quality_report?.selected_timing||{};const trace=record.timed_trace||[];const duration=trace.length?trace[trace.length-1][0]:0;const audit=record.quality_report?.selected||{};const switches=timing.mode_switch_count??0;$('metrics').textContent=`结果：${record.outcome} ｜ 执行时间：${duration.toFixed(2)} s ｜ 切模式：${switches} 次 ｜ 初筛：${LABELS[record.label]}${a?' ｜ 二审提示：'+(a.flags||[]).join('；'):''}`;$('seek').max=duration;$('seek').value=0;$('play').disabled=!trace.length;$('switch').disabled=!trace.length;$('details').textContent=JSON.stringify({record_id:record.record_id,request:record.request,task_id:record.task_id,execution_contract:record.execution_contract,audit,analysis:a,source:record.record_path},null,2);mapImage=null;if(record.map_id){const img=new Image();const expected=id;img.onload=()=>{if(selected===expected){mapImage=img;draw()}};img.src='/map/'+record.map_id+'.png'}draw();$('arrival').textContent='';$('message').textContent=''}catch(e){$('message').textContent=e.message}finally{loading=false}}
function transform(){const m=record?.map;if(!m)return null;const w=m.width*m.resolution,h=m.height*m.resolution,scale=Math.min(1060/w,610/h),left=(1100-w*scale)/2,top=(650-h*scale)/2;return {scale,xy:(x,y)=>[left+(x-m.origin[0])*scale,top+(h-(y-m.origin[1]))*scale],left,top,w:w*scale,h:h*scale}}
function draw(){const c=$('canvas'),ctx=c.getContext('2d');ctx.fillStyle='#ddd';ctx.fillRect(0,0,c.width,c.height);const tr=transform();if(!tr)return;const {xy,scale}=tr;if(mapImage)ctx.drawImage(mapImage,tr.left,tr.top,tr.w,tr.h);const trace=record.timed_trace||[];if($('corridors').checked){for(const m of record.corridors||[]){ctx.strokeStyle=`rgba(${(m.color||[0,.7,1,.8]).slice(0,3).map(v=>Math.round(v*255)).join(',')},.65)`;ctx.lineWidth=1;const pts=m.points||[];ctx.beginPath();for(let i=0;i<pts.length;i++){const p=xy(pts[i][0],pts[i][1]);if(i===0||(m.type===5&&i%2===0))ctx.moveTo(...p);else ctx.lineTo(...p)}ctx.stroke()}}for(let i=1;i<trace.length;i++){const a=trace[i-1],b=trace[i];ctx.strokeStyle=COLORS[b[5]];ctx.lineWidth=2.3;ctx.beginPath();ctx.moveTo(...xy(a[1],a[2]));ctx.lineTo(...xy(b[1],b[2]));ctx.stroke()}function arrow(p,color){if(!p)return;const q=xy(p[0],p[1]);ctx.save();ctx.translate(...q);ctx.rotate(-p[2]);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(2,-8);ctx.lineTo(2,-3);ctx.lineTo(-15,-3);ctx.lineTo(-15,3);ctx.lineTo(2,3);ctx.lineTo(2,8);ctx.closePath();ctx.fill();ctx.restore()}arrow(record.request?.start,'#18b51b');arrow(record.request?.goal,'#e52525');if(!trace.length){$('time').textContent='无已发布的可执行轨迹；失败记录可以保存为参考或剔除。';return}let lo=0,hi=trace.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(trace[mid][0]<t)lo=mid+1;else hi=mid}const b=trace[Math.max(1,lo)],a=trace[Math.max(0,lo-1)],f=Math.max(0,Math.min(1,(t-a[0])/(b[0]-a[0]||1)));const pose=[a[1]+f*(b[1]-a[1]),a[2]+f*(b[2]-a[2]),a[3]+f*Math.atan2(Math.sin(b[3]-a[3]),Math.cos(b[3]-a[3]))];ctx.save();ctx.translate(...xy(pose[0],pose[1]));ctx.rotate(-pose[2]);const v=record.execution_contract;ctx.fillStyle='#3169e788';ctx.strokeStyle='#2057c9';ctx.fillRect(-v.length_m*scale/2,-v.width_m*scale/2,v.length_m*scale,v.width_m*scale);ctx.strokeRect(-v.length_m*scale/2,-v.width_m*scale/2,v.length_m*scale,v.width_m*scale);ctx.restore();arrow(pose,'#d32b2b');const hold=(record.quality_report?.selected_timing?.phases||[]).find(p=>(p.kind==='mode_switch'||p.mode_switch_event)&&t>=p.t0&&t<p.t0+p.duration);$('time').textContent=`${t.toFixed(2)} / ${trace[trace.length-1][0].toFixed(2)} s · ${MODES[a[5]]} · v=${(a[4]+f*(b[4]-a[4])).toFixed(2)} m/s${hold?' · 切换静止驻留 '+hold.duration.toFixed(2)+' s':''}`}
$('records').onchange=()=>{if(dirty&&!confirm('当前标注尚未保存，切换会放弃编辑，是否继续？')){$('records').value=selected;return}load($('records').value)};$('latest').onclick=()=>{if(!state.records.length)return;if(dirty&&!confirm('当前标注未保存，是否切换？'))return;scope=null;$('filter').value='all';list();load(state.records[state.records.length-1].record_id)};$('filter').onchange=list;$('sameTask').onclick=async()=>{scope=record?.task_id;list();await compareTask()};$('showAll').onclick=()=>{scope=null;list();$('comparisonPanel').hidden=true};$('grade').onchange=$('notes').oninput=()=>{dirty=true};for(const text of ['不必要 Spin','切换太早','路线绕远','倒车过多','路线很好']){const b=document.createElement('button');b.textContent=text;b.onclick=()=>{$('notes').value+=($('notes').value?'；':'')+text;dirty=true};$('reasons').append(b)}
async function compareTask(){if(!record)return;const current=record,container=$('comparisonCards');container.replaceChildren();$('comparisonPanel').hidden=false;for(const meta of state.records.filter(r=>r.task_id===current.task_id)){const r=await api('/api/record/'+meta.record_id);if(r.execution_contract.sha256!==current.execution_contract.sha256)continue;const tile=document.createElement('article');tile.className='tile';const h=document.createElement('h3');h.textContent=r.branch+' #'+r.plan_id;tile.append(h);const m=r.map;if(m){const w=m.width*m.resolution,hg=m.height*m.resolution,scale=Math.min(620/w,430/hg),left=(640-w*scale)/2,top=(450-hg*scale)/2,xy=p=>[left+(p[0]-m.origin[0])*scale,top+(hg-(p[1]-m.origin[1]))*scale];const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 640 450');function shape(tag,attrs){const n=document.createElementNS(svg.namespaceURI,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));svg.append(n);return n}shape('image',{href:'/map/'+r.map_id+'.png',x:left,y:top,width:w*scale,height:hg*scale});for(const marker of r.corridors||[]){const pts=marker.points||[],color=marker.color||[0,.7,1,1];for(let i=1;i<pts.length;i++){if(marker.type===5&&i%2===0)continue;const a=xy(pts[i-1]),b=xy(pts[i]);shape('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:`rgb(${color.slice(0,3).map(v=>Math.round(v*255)).join(',')})`,'stroke-width':.7,opacity:.65})}}const trace=r.timed_trace||[];let run=[],runMode=null;const flush=()=>{if(run.length)shape('polyline',{points:run.map(p=>p.join(',')).join(' '),fill:'none',stroke:COLORS[runMode],'stroke-width':1.5})};for(let i=0;i<trace.length;i++){const v=trace[i];if(v[5]!==runMode){flush();run=i?[xy(trace[i-1].slice(1,3))]:[];runMode=v[5]}run.push(xy(v.slice(1,3)))}flush();for(const [p,color] of [[r.request?.start,'#15b51b'],[r.request?.goal,'#e52a2a']]){if(!p)continue;const q=xy(p);shape('path',{d:'M 12 0 L -4 -5 L -4 5 Z',fill:color,transform:`translate(${q[0]} ${q[1]}) rotate(${-p[2]*180/Math.PI})`})}tile.append(svg)}const text=document.createElement('p'),timing=r.quality_report?.selected_timing;text.textContent=`${r.outcome} ｜ ${timing?timing.duration_s.toFixed(2)+' s':'无执行轨迹'} ｜ 切换 ${timing?.mode_switch_count??'—'} 次 ｜ 初筛 ${LABELS[r.label]} / 二筛 ${LABELS[r.review_label]}`;tile.append(text);const button=document.createElement('button');button.textContent='查看并标注';button.onclick=()=>{if(dirty&&!confirm('当前标注未保存，是否切换？'))return;load(r.record_id)};tile.append(button);container.append(tile)}}
$('save').onclick=async()=>{try{const value=await api('/api/label',{record_id:selected,result_sha256:record.result_sha256,grade:$('grade').value,notes:$('notes').value,preview_png:$('canvas').toDataURL('image/png')});dirty=false;await load(selected);await refresh();$('message').textContent='已保存到：'+value.saved}catch(e){$('message').textContent='保存失败：'+e.message}};$('timeout').onclick=async()=>{try{const v=await api('/api/timeout',{record_id:selected});await load(selected);$('message').textContent=v.note}catch(e){$('message').textContent=e.message}};
$('export').onclick=async()=>{try{const v=await api('/api/export'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(v,null,2)],{type:'application/json'}));a.download='collected_labels_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}catch(e){$('message').textContent=e.message}};$('play').onclick=()=>{const trace=record?.timed_trace||[];if(!trace.length)return;if(t>=trace[trace.length-1][0])t=0;playing=!playing;last=performance.now();$('play').textContent=playing?'暂停':'播放'};$('seek').oninput=()=>{t=Number($('seek').value);draw()};$('corridors').onchange=draw;$('switch').onclick=()=>{const events=(record?.quality_report?.selected_timing?.phases||[]).filter(p=>p.kind==='mode_switch'||p.mode_switch_event);t=(events.find(p=>p.t0>t+.01)||{t0:0}).t0;$('seek').value=t;draw()};function tick(now){if(playing){t=Math.min(Number($('seek').max),t+(now-last)/1000*Number($('speed').value));$('seek').value=t;draw();if(t>=Number($('seek').max)){playing=false;$('play').textContent='播放'}}last=now;requestAnimationFrame(tick)}window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});refresh();setInterval(refresh,1800);requestAnimationFrame(tick);
</script></html>
