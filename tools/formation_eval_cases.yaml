schema: formation_eval_cases/v1
# Fixed S10 multi-vehicle formation regression manifest.  IDs E01--E20 are
# frozen; details are part of the experiment record and must not be edited
# between compared runs without a new schema revision.
defaults:
  stamp: [123, 456]
  map:
    width: 320
    height: 240
    resolution: 0.05
    origin: [-8.0, -6.0]
    obstacles: []
  body:
    length_m: 0.738
    width_m: 0.500
  pipeline:
    max_candidates: 2
    max_schedule_combinations: 8
    max_schedules_per_block: 2
    planning_dt_s: 0.02
    enable_nlp: false
    require_collision_precheck: true
  quality:
    collision_margin_m: 0.05
    sweep_spacing_m: 0.01
    publication_dt_s: 0.02
    max_samples_per_segment: 200000

cases:
  - id: E01
    title: 单车基线直线
    kind: pipeline
    expectation: success
    tags: [baseline, single_vehicle, empty_map]
    formation:
      offsets: [[0.0, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [2.0, 0.0, 0.0]
      start_headings: [0.0]
      goal_headings: [0.0]
    primitives:
      - {type: translation, dx: 2.0}

  - id: E02
    title: 三车横向楔形直线
    kind: pipeline
    expectation: success
    tags: [formation, N3, straight]
    formation:
      offsets: [[0.0, 0.0], [0.0, 1.2], [0.0, -1.2]]
      start: [0.0, 0.0, 0.0]
      goal: [2.5, 0.0, 0.0]
      start_headings: [0.0, 0.0, 0.0]
      goal_headings: [0.0, 0.0, 0.0]
    primitives:
      - {type: translation, dx: 2.5}

  - id: E03
    title: V 形三车刚体旋转
    kind: pipeline
    expectation: success
    tags: [formation, N3, rotation, spin]
    formation:
      offsets: [[0.0, 0.0], [1.2, 1.2], [1.2, -1.2]]
      start: [0.0, 0.0, 0.0]
      goal: [0.0, 0.0, 0.4]
      start_headings:
        [0.0, 2.356194490192345, 0.7853981633974483]
      goal_headings:
        [0.4, 2.756194490192345, 1.1853981633974482]
    primitives:
      - {type: rotation, dpsi: 0.4}

  - id: E04
    title: 宽弯平移-旋转-平移
    kind: pipeline
    expectation: success
    tags: [formation, N2, bend, oblique]
    formation:
      offsets: [[1.2, 0.0], [-1.2, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [1.955336489125606, 0.29552020666133955, 0.3]
      start_headings: [1.5707963267948966, -1.5707963267948966]
      goal_headings: [1.8707963267948965, -1.2707963267948966]
      allow_reverse: true
    primitives:
      - {type: translation, dx: 1.0}
      - {type: rotation, dpsi: 0.3}
      - {type: translation, dx: 1.0}

  - id: E05
    title: 不可通过的 0.8 m 门洞
    kind: pipeline
    expectation: must_fail
    expected_failure_codes:
      [COLLISION_PRECHECK_FAILED, FORMATION_SWEEP_COLLISION]
    tags: [formation, N3, narrow_door, reject]
    map:
      obstacles:
        - [1.4, -6.0, 1.6, -0.4]
        - [1.4, 0.4, 1.6, 6.0]
    formation:
      offsets: [[0.0, 0.0], [0.0, 1.2], [0.0, -1.2]]
      start: [0.0, 0.0, 0.0]
      goal: [3.0, 0.0, 0.0]
      start_headings: [0.0, 0.0, 0.0]
      goal_headings: [0.0, 0.0, 0.0]
    primitives:
      - {type: translation, dx: 3.0}

  - id: E06
    title: 1.2 m 门洞特定纵向队形通过
    kind: pipeline
    expectation: success
    tags: [formation, N2, narrow_door, orientation]
    map:
      obstacles:
        - [1.4, -6.0, 1.6, -0.6]
        - [1.4, 0.6, 1.6, 6.0]
    formation:
      offsets: [[0.0, 0.0], [1.0, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [3.0, 0.0, 0.0]
      start_headings: [0.0, 0.0]
      goal_headings: [0.0, 0.0]
    primitives:
      - {type: translation, dx: 3.0}

  - id: E07
    title: 90 度急弯折线
    kind: pipeline
    expectation: success
    tags: [formation, N2, corner, mode_switch]
    formation:
      offsets: [[1.2, 0.0], [-1.2, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [1.0, 1.0, 1.5707963267948966]
      start_headings: [1.5707963267948966, -1.5707963267948966]
      goal_headings: [3.141592653589793, 0.0]
      allow_reverse: true
    primitives:
      - {type: translation, dx: 1.0}
      - {type: rotation, dpsi: 1.5707963267948966}
      - {type: translation, dx: 1.0}

  - id: E08
    title: S 形窄通道
    kind: pipeline
    expectation: success
    tags: [formation, N2, s_channel, oblique]
    map:
      obstacles:
        - [0.8, -6.0, 0.95, -0.2]
        - [1.8, 1.6, 1.95, 6.0]
    formation:
      offsets: [[0.0, 0.0], [0.6, 0.6]]
      start: [0.0, 0.0, 0.0]
      goal: [2.0, 0.0, 0.0]
      start_headings: [0.0, 0.0]
      goal_headings: [0.0, 0.0]
    primitives:
      - {type: translation, dx: 1.0, dy: 0.6}
      - {type: translation, dx: 1.0, dy: -0.6}

  - id: E09
    title: 起点 OBB 重叠
    kind: evaluator
    expectation: must_fail
    expected_failure_codes: [START_FORMATION_COLLISION]
    tags: [formation, N3, collision, start]
    formation:
      offsets: [[0.0, 0.0], [0.2, 0.15], [-0.2, -0.15]]
      start: [0.0, 0.0, 0.0]
      goal: [2.0, 0.0, 0.0]
      start_headings: [0.0, 0.0, 0.0]
      goal_headings: [0.0, 0.0, 0.0]
    primitives:
      - {type: translation, dx: 2.0}

  - id: E10
    title: 路径中段障碍扫掠碰撞
    kind: evaluator
    expectation: must_fail
    expected_failure_codes: [FORMATION_SWEEP_COLLISION]
    tags: [formation, single_vehicle, collision, sweep]
    map:
      obstacles:
        - [1.2, -0.4, 1.4, 0.4]
    formation:
      offsets: [[0.0, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [2.0, 0.0, 0.0]
      start_headings: [0.0]
      goal_headings: [0.0]
    primitives:
      - {type: translation, dx: 2.0}

  - id: E11
    title: 起点中心不满足刚体约束的请求
    kind: request_invalid
    expectation: must_fail
    expected_failure_codes: [INVALID_REQUEST]
    expected_field: start_center
    tags: [request, invalid, rigidity]
    request_mutation:
      kind: start_center_offset
      vehicle_index: 0
      delta: 0.2
    formation:
      offsets: [[0.0, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [2.0, 0.0, 0.0]
      start_headings: [0.0]
      goal_headings: [0.0]
    primitives:
      - {type: translation, dx: 2.0}

  - id: E12
    title: 目标队形镜像的请求
    kind: request_invalid
    expectation: must_fail
    expected_failure_codes: [INVALID_REQUEST]
    expected_field: goal_center
    tags: [request, invalid, goal_mirror, rigidity, vehicle_id]
    request_mutation:
      kind: goal_mirror
    formation:
      offsets: [[0.0, 0.0], [0.6, 0.4]]
      start: [0.0, 0.0, 0.0]
      goal: [2.0, 0.0, 0.0]
      start_headings: [0.0, 0.0]
      goal_headings: [0.0, 0.0]
    primitives:
      - {type: translation, dx: 2.0}

  - id: E13
    title: A 模式控制量篡改
    kind: evaluator
    expectation: must_fail
    expected_failure_codes: [KINEMATIC_INFEASIBLE]
    tags: [tamper, mode_schedule, ackermann]
    formation:
      offsets: [[0.0, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [2.0, 0.0, 0.0]
      start_headings: [0.0]
      goal_headings: [0.0]
    primitives:
      - {type: translation, dx: 2.0}
    tamper:
      kind: mode_control_offset
      vehicle_id: 1
      mode: 0
      min_time_s: 0.3
      delta: 0.2

  - id: E14
    title: O 模式车体航向篡改
    kind: evaluator
    expectation: must_fail
    expected_failure_codes: [KINEMATIC_INFEASIBLE]
    tags: [tamper, body_heading, oblique]
    formation:
      offsets: [[1.2, 0.0], [-1.2, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [1.955336489125606, 0.29552020666133955, 0.3]
      start_headings: [1.5707963267948966, -1.5707963267948966]
      goal_headings: [1.8707963267948965, -1.2707963267948966]
      allow_reverse: true
    primitives:
      - {type: translation, dx: 1.0}
      - {type: rotation, dpsi: 0.3}
      - {type: translation, dx: 1.0}
    tamper:
      kind: theta_offset
      vehicle_id: 1
      mode: 1
      min_time_s: 1.0
      delta: 0.1

  - id: E15
    title: S 模式旋转中心速度篡改
    kind: evaluator
    expectation: must_fail
    expected_failure_codes: [KINEMATIC_INFEASIBLE]
    tags: [tamper, spin, speed]
    formation:
      offsets: [[0.0, 0.0], [1.2, 1.2], [1.2, -1.2]]
      start: [0.0, 0.0, 0.0]
      goal: [0.0, 0.0, 0.4]
      start_headings:
        [0.0, 2.356194490192345, 0.7853981633974483]
      goal_headings:
        [0.4, 2.756194490192345, 1.1853981633974482]
    primitives:
      - {type: rotation, dpsi: 0.4}
    tamper:
      kind: center_speed
      vehicle_id: 1
      mode: 2
      min_time_s: 0.3
      delta: 0.3

  - id: E16
    title: 共同时间轴篡改
    kind: evaluator
    expectation: must_fail
    expected_failure_codes: [INVALID_TIMED_TRAJECTORY]
    tags: [tamper, common_time, message_contract]
    formation:
      offsets: [[0.0, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [2.0, 0.0, 0.0]
      start_headings: [0.0]
      goal_headings: [0.0]
    primitives:
      - {type: translation, dx: 2.0}
    tamper:
      kind: point_time_offset
      vehicle_id: 1
      point_index: 5
      delta: 0.001

  - id: E17
    title: 严格模式驻留时间下的模式切换
    kind: evaluator
    expectation: must_fail
    expected_failure_codes: [MODE_SCHEDULE_INFEASIBLE]
    tags: [tamper, mode_dwell, policy]
    formation:
      offsets: [[1.2, 0.0], [-1.2, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [1.955336489125606, 0.29552020666133955, 0.3]
      start_headings: [1.5707963267948966, -1.5707963267948966]
      goal_headings: [1.8707963267948965, -1.2707963267948966]
      allow_reverse: true
    primitives:
      - {type: translation, dx: 1.0}
      - {type: rotation, dpsi: 0.3}
      - {type: translation, dx: 1.0}
    evaluation_timing_overrides:
      min_mode_dwell_s: 10.0

  - id: E18
    title: 无效请求清空旧轨迹事务
    kind: node
    expectation: scenario_pass
    tags: [node, transactional, cleanup, stale_plan]
    formation:
      offsets: [[0.0, 0.0]]
      start: [0.0, 0.0, 0.0]
      goal: [2.0, 0.0, 0.0]
      start_headings: [0.0]
      goal_headings: [0.0]
    primitives:
      - {type: translation, dx: 2.0}
    scenario:
      invalid_requests: [nan_start, empty_vehicles]
      stale_seed_after_invalid: true

  - id: E19
    title: 相同地图 N=1/2/3 统计
    kind: group
    expectation: statistical
    tags: [ablation, N1_N2_N3, statistics]
    group_runs:
      - label: N1
        formation:
          offsets: [[0.0, 0.0]]
          start: [0.0, 0.0, 0.0]
          goal: [2.5, 0.0, 0.0]
          start_headings: [0.0]
          goal_headings: [0.0]
        primitives:
          - {type: translation, dx: 2.5}
      - label: N2
        formation:
          offsets: [[0.0, 0.0], [0.0, 1.2]]
          start: [0.0, 0.0, 0.0]
          goal: [2.5, 0.0, 0.0]
          start_headings: [0.0, 0.0]
          goal_headings: [0.0, 0.0]
        primitives:
          - {type: translation, dx: 2.5}
      - label: N3
        formation:
          offsets: [[0.0, 0.0], [0.0, 1.2], [0.0, -1.2]]
          start: [0.0, 0.0, 0.0]
          goal: [2.5, 0.0, 0.0]
          start_headings: [0.0, 0.0, 0.0]
          goal_headings: [0.0, 0.0, 0.0]
        primitives:
          - {type: translation, dx: 2.5}

  - id: E20
    title: 队形尺寸与障碍密度统计
    kind: group
    expectation: statistical
    tags: [ablation, formation_size, obstacle_density, statistics]
    group_runs:
      - label: N2_empty
        formation:
          offsets: [[0.0, 0.0], [0.0, 1.2]]
          start: [0.0, 0.0, 0.0]
          goal: [2.5, 0.0, 0.0]
          start_headings: [0.0, 0.0]
          goal_headings: [0.0, 0.0]
        primitives:
          - {type: translation, dx: 2.5}
      - label: N3_empty
        formation:
          offsets: [[0.0, 0.0], [0.0, 1.2], [0.0, -1.2]]
          start: [0.0, 0.0, 0.0]
          goal: [2.5, 0.0, 0.0]
          start_headings: [0.0, 0.0, 0.0]
          goal_headings: [0.0, 0.0, 0.0]
        primitives:
          - {type: translation, dx: 2.5}
      - label: N3_sparse
        map:
          obstacles:
            - [1.0, -2.1, 1.3, -1.9]
            - [1.0, 1.9, 1.3, 2.1]
        formation:
          offsets: [[0.0, 0.0], [0.0, 1.2], [0.0, -1.2]]
          start: [0.0, 0.0, 0.0]
          goal: [2.5, 0.0, 0.0]
          start_headings: [0.0, 0.0, 0.0]
          goal_headings: [0.0, 0.0, 0.0]
        primitives:
          - {type: translation, dx: 2.5}
      - label: N3_dense
        map:
          obstacles:
            - [0.6, -2.1, 0.9, -1.9]
            - [0.6, 1.9, 0.9, 2.1]
            - [1.6, -1.95, 1.9, -1.75]
            - [1.6, 1.75, 1.9, 1.95]
        formation:
          offsets: [[0.0, 0.0], [0.0, 1.2], [0.0, -1.2]]
          start: [0.0, 0.0, 0.0]
          goal: [2.5, 0.0, 0.0]
          start_headings: [0.0, 0.0, 0.0]
          goal_headings: [0.0, 0.0, 0.0]
        primitives:
          - {type: translation, dx: 2.5}